name: Upload custom assets to GitHub release

on:
  release:
    types:
      - published

env:
  CI: true

jobs:
  upload-assets:
    name: Generate and upload assets
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            pnpm_script: pack:linux
            dist_folder: deb
            extension: deb
          - os: ubuntu-latest
            pnpm_script: pack:tarballs
            dist_folder: tar
            extension: tar.gz
          - os: ubuntu-latest
            pnpm_script: pack:tarballs:alpine
            dist_folder: tar
            extension: alpine.tar.gz
            container: 'node:24-alpine'
            alpine: true
          - os: ubuntu-latest
            pnpm_script: pack:windows
            dist_folder: win32
            extension: x64.exe
          - os: ubuntu-latest
            pnpm_script: pack:windows
            dist_folder: win32
            extension: x86.exe
          - os: macos-latest
            pnpm_script: pack:macos
            dist_folder: macos
            extension: arm64.pkg
          - os: macos-latest
            pnpm_script: pack:macos
            dist_folder: macos
            extension: x64.pkg
    
    container: ${{ matrix.container }}
    
    steps:
      - name: Install base tools for alpine container
        if: matrix.container == 'node:24-alpine'
        run: |
          apk add --no-cache bash git python3 make g++ perl-utils xz
          corepack enable

      - name: Checkout repository
        uses: actions/checkout@v4

      # Needed to avoid "fatal: detected dubious ownership in repository" error when using alpine container
      - name: Mark GitHub workspace as safe
        if: matrix.container == 'node:24-alpine'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      
      - name: Set up pnpm
        if: matrix.container == ''
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      
      - name: Setup Node.js
        if: matrix.container == ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Get version from package.json
        uses: actions/github-script@v6
        id: extractver
        with:
          script: |
            const packageJson = require('./package.json');
            const packageJsonVersion = packageJson.version;
            core.setOutput('version', packageJsonVersion);
      - if: matrix.pnpm_script == 'pack:windows'
        #fix for windows build issue #1433
        name: Install p7zip-full nsis
        run: sudo apt-get install -y p7zip-full nsis

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build project
        shell: bash
        run: pnpm prepublishOnly
      - name: Assets generation
        shell: bash
        run: |
          pnpm ${{ matrix.pnpm_script }}
          if [[ "${{ matrix.alpine }}" == "true" ]]; then
            pnpm pack:rename alpine
          else
            pnpm pack:rename
          fi
      
      - name: Update release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/${{ matrix.dist_folder }}/asyncapi.${{ matrix.extension }}
          tag_name: v${{ steps.extractver.outputs.version }}
          token: ${{ secrets.GH_TOKEN }}
      - if: failure() # Only, on failure, send a message on the 94_bot-failing-ci slack channel
        name: Report workflow run status to Slack
        uses: 8398a7/action-slack@fbd6aa58ba854a740e11a35d0df80cb5d12101d8 #using https://github.com/8398a7/action-slack/releases/tag/v3.15.1
        with:
          status: ${{ job.status }}
          fields: repo,action,workflow
          text: 'AsyncAPI CLI release build artifacts failed'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CI_FAIL_NOTIFY }}
