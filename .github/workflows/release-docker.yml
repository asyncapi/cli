name: Release Docker Image
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing stable CLI tag to rebuild the action image (vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: read
jobs:
  publish-docker:
    if: github.repository == 'asyncapi/cli' && !github.event.release.draft && !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v') && !contains(github.event.release.tag_name, '-')
    name: Generating Docker
    runs-on: ubuntu-latest
    steps:
      - name: Get version without v character
        id: version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          [[ "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          VERSION_WITHOUT_V=${TAG_NAME#v}
          echo "value=${VERSION_WITHOUT_V}" >> "$GITHUB_OUTPUT"

      - name : Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@68827325e0b33c7199eb31dd4e31fbe9023e06e3 # v3.0.0

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@d70bba72b1f3fd22344832f00baa16ece964efeb # v3.3.0

      - name: login to Docker Hub
        uses: docker/login-action@e92390c5fb421da1463c202d546fed0ec5c39f20 # v3.1.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        uses: docker/build-push-action@2cdde995de11925a030ce8070c3d77a52ffcf1c0 # v5.3.0
        with:
          push: true
          load: false
          build-args: |
            ASYNCAPI_CLI_VERSION=${{ steps.version.outputs.value }}
          tags: |
            asyncapi/cli:${{ steps.version.outputs.value }}
            asyncapi/cli:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha

      - name:  Sync README.md and Description to Docker Hub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: meeDamian/sync-readme@82715041300710d9be7c726c9d6c683b70451087 # v1.0.6
        with:
          user: ${{ secrets.DOCKER_USERNAME }}
          pass: ${{ secrets.DOCKER_PASSWORD }}
          slug: asyncapi/cli
          description: CLI to work with your AsyncAPI files

  publish-action-docker:
    if: github.repository == 'asyncapi/cli' && (github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v') && !contains(github.event.release.tag_name, '-')))
    name: Build action image (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.version }}
          persist-credentials: false

      - name: Validate release source
        env:
          TAG_NAME: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          [[ "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          [[ "v$(node -p "require('./package.json').version")" == "$TAG_NAME" ]] || exit 1

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Docker Hub
        uses: docker/login-action@e92390c5fb421da1463c202d546fed0ec5c39f20 # v3.1.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./github-action/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=asyncapi/github-action-for-cli,push-by-digest=true,name-canonical=true,push=true

      - name: Verify action image
        env:
          IMAGE: asyncapi/github-action-for-cli@${{ steps.build.outputs.digest }}
        run: |
          docker run --rm --entrypoint asyncapi "$IMAGE" --version
          docker run --rm --entrypoint asyncapi -v "$PWD/github-action/test:/spec:ro" "$IMAGE" validate /spec/asyncapi.yml

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: action-image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  publish-action-manifest:
    name: Publish multi-platform action image
    needs: publish-action-docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: action-image-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Docker Hub
        uses: docker/login-action@e92390c5fb421da1463c202d546fed0ec5c39f20 # v3.1.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publish version tag after both images pass verification
        working-directory: ${{ runner.temp }}/digests
        env:
          TAG_NAME: ${{ github.event.release.tag_name || inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          [[ "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          tags=(--tag "asyncapi/github-action-for-cli:${TAG_NAME#v}")
          # Rebuilding an older version must not move latest backwards.
          if [[ "$EVENT_NAME" == "release" ]]; then
            tags+=(--tag asyncapi/github-action-for-cli:latest)
          fi
          images=()
          for digest in *; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]] || exit 1
            images+=("asyncapi/github-action-for-cli@sha256:$digest")
          done
          [[ ${#images[@]} == 2 ]] || exit 1
          docker buildx imagetools create "${tags[@]}" "${images[@]}"
          docker buildx imagetools inspect "asyncapi/github-action-for-cli:${TAG_NAME#v}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.version }}
          persist-credentials: false

      - uses: meeDamian/sync-readme@82715041300710d9be7c726c9d6c683b70451087 # v1.0.6
        with:
          user: ${{ secrets.DOCKER_USERNAME }}
          pass: ${{ secrets.DOCKER_PASSWORD }}
          slug: asyncapi/github-action-for-cli
          description: Github action for AsyncAPI CLI

