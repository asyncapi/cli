name: Release
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cli-stable-release
  cancel-in-progress: false
env:
  CI: true
jobs:
  test:
    if: github.repository == 'asyncapi/cli' && github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # The shared selector installs semver; reuse its output in publishing jobs.
    outputs:
      node-version: ${{ steps.lockversion.outputs.version }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Determine Node.js version
        id: lockversion
        uses: asyncapi/.github/.github/actions/get-node-version-from-package-lock@3fff8062a30ea14b4a6676b7f2d2e110e75c5a1d
        with:
          node-version: ${{ vars.NODE_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ steps.lockversion.outputs.version }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - if: matrix.os == 'ubuntu-latest'
        run: npm run lint

  version-pr:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      has-changesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ needs.test.outputs.node-version }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Create or update the standard Changesets version PR
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: npm run bump:version
          commit: 'chore(release): release and bump versions of packages'
          title: 'chore(release): release and bump versions of packages'
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  packages:
    needs: [test, version-pr]
    if: needs.version-pr.outputs.has-changesets == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ needs.test.outputs.node-version }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/publish-trusted.js --pack "$RUNNER_TEMP/release-packages"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-packages-${{ github.sha }}
          path: ${{ runner.temp }}/release-packages/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [test, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ needs.test.outputs.node-version }}
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-packages-${{ github.sha }}
          path: ${{ runner.temp }}/release-packages
      - name: Publish built tarballs with OIDC and no lifecycle scripts
        run: node scripts/publish-trusted.js --publish "$RUNNER_TEMP/release-packages"

  github-release:
    needs: [test, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ needs.test.outputs.node-version }}
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-packages-${{ github.sha }}
          path: ${{ runner.temp }}/release-packages
      - name: Create tags and releases after successful npm publication
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: node scripts/publish-trusted.js --releases "$RUNNER_TEMP/release-packages"
